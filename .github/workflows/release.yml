name: Release

# Publishing a GitHub release with a new SemVer tag (v*.*.*), created on the release page of the web
# interface, builds, verifies and publishes the agent binary and the backend image and attaches the
# assets to that release. This is the only trigger. If a job fails, the release is turned back into a
# draft. Pull requests are checked by ci.yml, never by this workflow.
# See docs/CONTRIBUTING.md (Versioning and releases) and records 0037 and 0041.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      # Full history and tags: needed for the `latest` decision and the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          REF: ${{ github.ref }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$TAG" | grep -Eq "$semver"; then
            echo "::error::tag '$TAG' is not a strict SemVer tag (vMAJOR.MINOR.PATCH[-prerelease], no build metadata)"
            exit 1
          fi
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::error::the run's ref '$REF' is not the release tag refs/tags/$TAG"
            exit 1
          fi
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          if [ "$prerelease" != "$RELEASE_PRERELEASE" ]; then
            echo "::error::the release's pre-release flag ($RELEASE_PRERELEASE) does not match the tag '$TAG': a tag with a pre-release suffix needs 'Set as a pre-release', any other tag must not have it"
            exit 1
          fi
          latest=false
          if [ "$prerelease" = "false" ]; then
            highest="$(git tag -l 'v*.*.*' | grep -v -- - | sort -V | tail -n1)"
            if [ "$highest" = "$TAG" ]; then
              latest=true
            fi
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      # Guards against a maintainer's mistake only; the tag ruleset is the security boundary.
      - name: Check tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::the tagged commit is not reachable from origin/main"
            exit 1
          fi

      # cache: false on purpose. A tag run may restore caches saved on the default
      # branch by ci.yml; the release is compiled from source only.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Vulnerability scan
        run: |
          set -euo pipefail
          go tool govulncheck ./...
          dotnet restore Vandox.slnx
          report="$(dotnet list Vandox.slnx package --vulnerable --include-transitive 2>&1)"
          echo "$report"
          if printf '%s' "$report" | grep -q 'has the following vulnerable packages'; then
            echo "::error::a NuGet package has a known vulnerability"
            exit 1
          fi

      - name: Build agent
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          pkg=github.com/LarsLaskowski/Vandox/internal/version
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X $pkg.Version=$TAG -X $pkg.Commit=$COMMIT -X $pkg.Date=$DATE" \
            -o dist/vandox-agent-linux-amd64 ./cmd/vandox-agent
          .github/scripts/package-agent.sh "$TAG" dist

      - name: Verify agent
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          .github/scripts/check-agent-bundle.sh dist "$TAG"
          info="$(file dist/vandox-agent-linux-amd64)"
          echo "$info"
          for want in "ELF 64-bit" "x86-64" "statically linked"; do
            case "$info" in
              *"$want"*) ;;
              *) echo "::error::agent binary is not '$want'"; exit 1 ;;
            esac
          done
          got="$(dist/vandox-agent-linux-amd64 --version)"
          want="vandox-agent $TAG (commit $COMMIT, built $DATE)"
          if [ "$got" != "$want" ]; then
            echo "::error::agent --version mismatch: got '$got', want '$want'"
            exit 1
          fi

      - name: Check base image pinning
        run: .github/scripts/check-base-image-pinning.sh

      - name: Check builder .NET version
        run: .github/scripts/check-builder-dotnet-version.sh

      # Plain Docker CLI, no cache of any kind (no --cache-from/--cache-to, no cache backend).
      - name: Build image
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          docker build --no-cache -f deploy/backend/Dockerfile \
            --build-arg VERSION="$TAG" --build-arg COMMIT="$COMMIT" --build-arg DATE="$DATE" \
            -t vandox:local .

      - name: Verify image
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          got="$(docker run --rm vandox:local --version)"
          want="vandoxd $TAG (commit $COMMIT, built $DATE)"
          if [ "$got" != "$want" ]; then
            echo "::error::vandoxd --version mismatch: got '$got', want '$want'"
            exit 1
          fi
          user="$(docker image inspect --format '{{.Config.User}}' vandox:local)"
          if [ "$user" != "65532:65532" ]; then
            echo "::error::image user is '$user', want 65532:65532"
            exit 1
          fi

      - name: Save image
        run: docker save vandox:local -o dist/vandox-image.tar

      # SPDX SBOMs for the binary and the image, from a digest-pinned syft container that runs without
      # network and without access to dist/ (record 0037). They travel in the release artifact and are
      # attested in the attest job; they are not release assets.
      - name: Generate SBOMs
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: .github/scripts/generate-sbom.sh dist/vandox-agent-linux-amd64 dist/vandox-image.tar "$TAG" dist

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish-image:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Load image
        run: docker load -i dist/vandox-image.tar

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      # Fails closed: only an explicit not-found counts as "version absent".
      - name: Check version is not published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -uo pipefail
          # The step shell runs with -e, so the expected non-zero status of a missing version is
          # captured with || instead of ending the script before rc is read.
          rc=0
          err="$(docker manifest inspect "networlddev/vandox:$VERSION" 2>&1 >/dev/null)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::networlddev/vandox:$VERSION already exists; published versions are never overwritten"
            exit 1
          fi
          if printf '%s' "$err" | grep -Eqi 'no such manifest|manifest unknown'; then
            echo "networlddev/vandox:$VERSION is not published yet"
            exit 0
          fi
          echo "::error::could not determine whether networlddev/vandox:$VERSION exists: $err"
          exit 1

      - name: Push image
        id: push
        env:
          VERSION: ${{ needs.build.outputs.version }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          set -euo pipefail
          docker tag vandox:local "networlddev/vandox:$VERSION"
          docker push "networlddev/vandox:$VERSION"
          if [ "$LATEST" = "true" ]; then
            docker tag vandox:local networlddev/vandox:latest
            docker push networlddev/vandox:latest
          fi
          repo_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "networlddev/vandox:$VERSION")"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io

  # Signs build provenance and SBOM attestations for the published binary and image (record 0037). Holds the OIDC signing permission and nothing else: no environment, no secret, no checkout.
  attest:
    needs: [build, publish-image]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Check release files
        run: |
          set -euo pipefail
          cd dist && sha256sum -c SHA256SUMS

      - name: Check image digest
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::publish-image digest '$DIGEST' is not sha256:<64 hex>"
            exit 1
          fi

      - name: Attest agent
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vandox-agent-linux-amd64

      - name: Attest install bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vandox-agent-install-${{ needs.build.outputs.tag }}.tar.gz

      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/networlddev/vandox
          subject-digest: ${{ needs.publish-image.outputs.digest }}

      - name: Attest agent SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/vandox-agent-linux-amd64
          sbom-path: dist/vandox-agent-linux-amd64.spdx.json

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: docker.io/networlddev/vandox
          subject-digest: ${{ needs.publish-image.outputs.digest }}
          sbom-path: dist/vandox-image.spdx.json

      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          flags=(--repo "$GH_REPO"
            --signer-workflow "$GH_REPO/.github/workflows/release.yml"
            --source-ref "refs/tags/$TAG"
            --deny-self-hosted-runners)
          gh attestation verify dist/vandox-agent-linux-amd64 "${flags[@]}"
          gh attestation verify "dist/vandox-agent-install-$TAG.tar.gz" "${flags[@]}"
          gh attestation verify "oci://docker.io/networlddev/vandox:$VERSION" "${flags[@]}"
          sbom_type=https://spdx.dev/Document/v2.3
          gh attestation verify dist/vandox-agent-linux-amd64 "${flags[@]}" --predicate-type "$sbom_type"
          gh attestation verify "oci://docker.io/networlddev/vandox:$VERSION" "${flags[@]}" --predicate-type "$sbom_type"

  github-release:
    needs: [build, publish-image, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      # No checkout in this job: GH_REPO tells gh which repository to use. The release itself was
      # published on the web page; this job attaches the assets and completes its notes.
      - name: Complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          set -euo pipefail
          cd dist
          gh release upload "$TAG" vandox-agent-linux-amd64 "vandox-agent-install-$TAG.tar.gz" SHA256SUMS --clobber
          body="$(gh release view "$TAG" --json body --jq .body)"
          if [ -z "$body" ]; then
            body="$(gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body)"
          fi
          line="Docker image: networlddev/vandox:$VERSION@$DIGEST"
          case "$body" in
            *"$line"*) ;;
            *) body="$(printf '%s\n\n%s\n' "$body" "$line")" ;;
          esac
          printf '%s' "$body" > ../release-notes.md
          # The web page may have set or cleared "latest"; the highest stable tag decides. --draft=false
          # publishes again a release that withdraw-release turned into a draft before a re-run (an
          # edit with the job token starts no new run).
          args=(--notes-file ../release-notes.md --draft=false)
          if [ "$LATEST" = "true" ]; then
            args+=(--latest=true)
          else
            args+=(--latest=false)
          fi
          gh release edit "$TAG" "${args[@]}"

  # A failed or cancelled release must not stay published without its assets: turn it back into a draft. The tag
  # stays; publishing the draft again starts a new run (see docs/CONTRIBUTING.md, Re-running a failed release).
  withdraw-release:
    needs: [build, publish-image, attest, github-release]
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Turn the release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # A complete release (both assets and the digest line, written last by github-release) was
          # finished by an earlier run; a republish or re-run of it stops at the never-overwrite check and
          # must not withdraw it. Read into variables first, so no pipe can fail on an early exit.
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          body="$(gh release view "$TAG" --json body --jq .body)"
          if printf '%s\n' "$names" | grep -qx vandox-agent-linux-amd64 &&
            printf '%s\n' "$names" | grep -qx "vandox-agent-install-$TAG.tar.gz" &&
            printf '%s\n' "$names" | grep -qx SHA256SUMS &&
            printf '%s\n' "$body" | grep -q '^Docker image: networlddev/vandox:'; then
            echo "::warning::the release $TAG is already complete from an earlier run; it stays published"
            exit 0
          fi
          gh release edit "$TAG" --draft=true
          echo "::warning::the release $TAG failed or was cancelled and was turned back into a draft"
