version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-packages:
        patterns:
          - "*"
    # The next major of these belongs to the next .NET (Microsoft.Extensions.* and Microsoft.Data.Sqlite 11.0.0 would
    # restore into a net10.0 project too): it comes with the change of the target framework, not alone.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]

  # The SDK of global.json: patch and feature bands as they are released; the next major (10 to 11) comes with the
  # change of the target framework, never alone.
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
