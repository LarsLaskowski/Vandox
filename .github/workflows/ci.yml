name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Surface newly-published CVEs against an otherwise unchanged codebase
    # without waiting for the next push/PR.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l reports unformatted files; run gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Dependabot runs do not receive repository secrets, so SONAR_TOKEN would be
    # empty and the scan would fail; skip the job for those PRs.
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # disable shallow clone for better analysis relevancy

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate coverage
        run: go test ./... -race -coverprofile=coverage.out

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck is a go.mod "tool" dependency (go 1.24+), so `go tool` runs
      # a go.sum-verified, checksummed version instead of an unpinned
      # `go install ...@latest` (which trips SonarCloud's S8545
      # dependency-pinning check). Dependabot's gomod ecosystem tracks and
      # bumps it like any other module requirement. The vulnerability
      # database itself is still fetched fresh at run time over the network,
      # independent of the tool's pinned version, so scans stay current.
      - name: Run govulncheck
        run: go tool govulncheck ./...

  # Builds the agent and the backend image the way the release does, with a fixed
  # dry-run version, and generates and checks the SBOMs (record 0056). Nothing is uploaded or pushed and
  # no secret is read. The real
  # release runs only on a version tag (release.yml, record 0053).
  release-build:
    name: Release build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check base image pinning
        run: .github/scripts/check-base-image-pinning.sh

      - name: Check builder Go version
        run: .github/scripts/check-builder-go-version.sh

      # A stale digest or a failed registry lookup is only a warning here; pinning and pattern errors
      # (status 1) still fail (record 0055).
      - name: Check base image digests
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/check-base-image-digests.sh || rc=$?
          case "$rc" in
            0|3) exit 0 ;;
            4) echo "::warning::base image digest lookup failed; freshness not checked (record 0055)"; exit 0 ;;
            *) exit "$rc" ;;
          esac

      - name: Build and verify agent
        run: |
          set -euo pipefail
          tag=v0.0.0-dryrun
          commit="$(git rev-parse HEAD)"
          date="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          pkg=github.com/LarsLaskowski/Vandox/internal/version
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X $pkg.Version=$tag -X $pkg.Commit=$commit -X $pkg.Date=$date" \
            -o dist/vandox-agent-linux-amd64 ./cmd/vandox-agent
          info="$(file dist/vandox-agent-linux-amd64)"
          for want in "ELF 64-bit" "x86-64" "statically linked"; do
            case "$info" in
              *"$want"*) ;;
              *) echo "::error::agent binary is not '$want'"; exit 1 ;;
            esac
          done
          got="$(dist/vandox-agent-linux-amd64 --version)"
          want="vandox-agent $tag (commit $commit, built $date)"
          if [ "$got" != "$want" ]; then
            echo "::error::agent --version mismatch: got '$got', want '$want'"
            exit 1
          fi

      - name: Build and verify image
        run: |
          set -euo pipefail
          tag=v0.0.0-dryrun
          commit="$(git rev-parse HEAD)"
          date="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          docker build -f deploy/backend/Dockerfile \
            --build-arg VERSION="$tag" --build-arg COMMIT="$commit" --build-arg DATE="$date" \
            -t vandox:local .
          got="$(docker run --rm vandox:local --version)"
          want="vandoxd $tag (commit $commit, built $date)"
          if [ "$got" != "$want" ]; then
            echo "::error::vandoxd --version mismatch: got '$got', want '$want'"
            exit 1
          fi
          user="$(docker image inspect --format '{{.Config.User}}' vandox:local)"
          if [ "$user" != "65532:65532" ]; then
            echo "::error::image user is '$user', want 65532:65532"
            exit 1
          fi

      # The release's SBOM step on the dry-run build; the image tar stays outside the checkout. Nothing is
      # uploaded (record 0056).
      - name: Generate and check SBOMs
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          docker save vandox:local -o "$work/vandox-image.tar"
          mkdir "$work/sbom"
          .github/scripts/generate-sbom.sh dist/vandox-agent-linux-amd64 "$work/vandox-image.tar" v0.0.0-dryrun "$work/sbom"
          ls -l "$work/sbom"
