# Configuration of vandox-agent. Default location: /etc/vandox/agent.yaml
#
# The agent binary reads this file at start-up (-config <file> names another path). The rules below
# describe the loader.
#
# The file is parsed strictly: an unknown key, a duplicate key, a second YAML document, an anchor, a
# custom tag or an invalid value stops the agent at start-up, and the error names the file, the line and
# the key.
#
# Secrets NEVER go into this file. They are read from the environment of the process (or, for a systemd
# unit or a Docker secret, from a file whose absolute path is given in the variable with the _FILE suffix):
#
#   VANDOX_AGENT_TOKEN       the token the backend expects from this agent (required, at least 32
#   VANDOX_AGENT_TOKEN_FILE  characters, printable ASCII without spaces; for example `openssl rand -hex 32`)
#
# Set either the variable or its _FILE form, not both.

# Name of this server, shown in the backend and sent with every batch (required).
# 1 to 64 characters of A-Z a-z 0-9 . _ -, starting with a letter or digit. No default.
agent_id: web-1

backend:
  # Base URL of the vandoxd ingest endpoint (required). Scheme http or https, a host and an optional port; no
  # user info, path, query or fragment. The installed unit lets the agent reach only localhost and the tailnet
  # (100.64.0.0/10, fd7a:115c:a1e0::/48): use the backend host's tailnet address or its MagicDNS name. Plain http
  # is fine there, the tailnet encrypts; the scheme must match the listener. No default.
  url: http://100.64.0.1:8081

  # Bandwidth the agent may use to send spooled data it has accumulated while the backend was
  # unreachable (the backfill): a whole number of KiB or MiB per second, from 16KiB to 1024MiB, such as
  # 256KiB or 4MiB. Current data is not limited by it. Default: 256KiB
  backfill_bandwidth: 256KiB

spool:
  # Directory of the local spool where the agent keeps data until the backend has received it. An
  # absolute, clean path (no trailing slash). Default: /var/lib/vandox/spool
  directory: /var/lib/vandox/spool

  # Size cap of all files of the spool: a whole number followed by MiB or GiB, from 64MiB to 64GiB. When
  # the cap leaves no room for new records, the agent drops the oldest spool data first. Default: 2GiB
  max_size: 2GiB

  # Free space that stays available on the file system of the spool: a whole number followed by MiB or
  # GiB, from 0MiB to 1024GiB. 0MiB (or 0GiB) switches the check off. Default: 1GiB
  min_free: 1GiB

log:
  # Log level: debug, info, warn or error. Default: info
  level: info

filesystem:
  # Mount points whose size and inode use is recorded every minute: a list of at most 16 absolute,
  # clean paths (no trailing slash, no . or .. elements) of at most 1024 bytes each, every path listed
  # once. A path that is not a mount point of the agent is logged once and left out. An empty list [] turns
  # the file system metrics off. Default: [/]
  mount_points: [/]

processes:
  # Rules that name the program a process belongs to, tried in this order; the first match wins and a
  # process that matches none is named by the first word of its command. At most 64 rules. Each rule has
  # `program` (the name, 1 to 128 characters of A-Z a-z 0-9 . _ : / @ + -, starting with a letter or
  # digit) and exactly one of `command` (the command of the process, compared as a whole) and
  # `cmdline_prefix` (the start of its command line, compared literally; 1 to 256 bytes). With
  # `append_next_word: true` (only with `cmdline_prefix`) the word after the prefix is appended to the
  # program as `<program>/<word>`. The process collector reads the processes every minute; see
  # deploy/agent/README.md for the right it needs to measure the proportional memory (PSS) of every
  # process. Default: [] (no rules). A rule that sums the PHP-FPM pools of a Plesk server, for example:
  #
  #   programs:
  #     - program: php-fpm
  #       cmdline_prefix: "php-fpm: pool "
  #       append_next_word: true
  programs: []

services:
  # Services whose state the collector `systemd` records, as unit names or patterns with `*` and `?`;
  # an entry without a unit type suffix means `<entry>.service`. At most 64 entries of 1 to 255 bytes
  # of A-Z a-z 0-9 : _ . @ * ? -, not starting with . or -; only service units, instances (not
  # templates), each listed once. An empty list [] turns the collector off. Default: sw-cp-server,
  # sw-engine, psa, nginx, apache2, postfix, dovecot, mariadb, plesk-php*-fpm, php*-fpm, fail2ban
  units:
    - sw-cp-server
    - sw-engine
    - psa
    - nginx
    - apache2
    - postfix
    - dovecot
    - mariadb
    - plesk-php*-fpm
    - php*-fpm
    - fail2ban

mariadb:
  # Whether the collector `mariadb` runs: it asks the local MariaDB server over its Unix socket for its
  # status, variables and, when many threads run or the server is under memory pressure, its process
  # list. `false` turns the collector off: no record, no log line, no connection. Default: true
  enabled: true
  # Path of the MariaDB Unix socket. An absolute, clean path (no trailing slash, no . or .. elements) of
  # at most 107 bytes. The agent logs in as the user `vandox-agent`, which deploy/agent/mariadb-user.sql
  # creates (see deploy/agent/README.md). Default: /run/mysqld/mysqld.sock
  socket: /run/mysqld/mysqld.sock

backups:
  # Processes that mean a backup is running, tried in this order: a process counts when its command
  # equals `command` (compared as a whole) or its command line starts with `cmdline_prefix` (compared
  # literally, no pattern). At most 64 rules, each with exactly one of the two, 1 to 256 bytes. The
  # collector `backups` checks the processes every 10 seconds and records when a backup run starts and
  # ends. An empty list [] turns the check off. Default: the three rules below, which come from the
  # processes captured during a Plesk backup: `pzstd` compresses, `backup-archiver --pack` packs every
  # part (including the database dumps) and `sw-tar --create` writes the tar stream. The modes --pack
  # and --create keep a restore from counting as a backup. A list given here replaces the default.
  processes:
    - command: pzstd
    - cmdline_prefix: "/opt/psa/admin/sbin/backup-archiver --pack "
    - cmdline_prefix: "/usr/lib/plesk-9.0/sw-tar --create "

log_shipping:
  # Whether the collector `logs` ships the systemd journal: the system files and the user files
  # (user-<UID>.journal, into which journald puts the entries of users with a UID of 1000 or more) of
  # /var/log/journal, else /run/log/journal. Default: true
  journal: true
  # The least severe priority that is shipped: emerg, alert, crit, err, warning, notice, info or debug. A
  # line with a known priority less severe than this is not shipped; a line without a priority (the lines of
  # a traditional syslog file) is never dropped by it. Default: info. The filter runs before the agent joins
  # MariaDB entries and classifies mail lines. The journal's MariaDB lines carry priority 6, so notice or
  # stricter drops them and no MariaDB event comes from the journal.
  min_priority: info
  # Log files shipped besides the journal: a list of at most 16 mappings with `path` (an absolute, clean path
  # of at most 1024 bytes, each listed once; it must not be, or lie behind, a symbolic link) and `format`
  # (`syslog`: the traditional or the RFC 3339 form of rsyslog's files; or an error log of Plesk and the web
  # servers: `plesk-panel`, `nginx-error`, `sw-cp-server-error` for Plesk's own web server, `apache-error`; any
  # other value is refused). The year-less times of `syslog` files and the times of the error logs, which carry
  # their year, are read in the time zone of /etc/localtime. A line that is not of the configured format is
  # shipped as it is, without a priority. A file that did not exist when the agent started is read
  # from its first line once it appears, a file that exists starts at its end: the history before the first
  # start is imported with `vandoxd import`. The agent follows a rotation by rename and a truncation in place.
  # The agent's groups (`adm`, `systemd-journal`) decide which files it can read; any other file is logged
  # "log file not readable" (permission denied) and not shipped (deploy/agent/README.md). Do not name a file that holds what the journal already ships (/var/log/syslog,
  # /var/log/mail.log of a server whose rsyslog copies the journal): every line would be shipped twice, once
  # with the source `journal` and once with the source `syslog`. Default: []
  #
  #   files:
  #     - {path: /var/log/mail.log, format: syslog}
  #     - {path: /var/log/nginx/error.log, format: nginx-error}
  #     - {path: /var/log/apache2/error.log, format: apache-error}
  #     - {path: /var/log/plesk/panel.log, format: plesk-panel}
  #     - {path: /var/log/sw-cp-server/error_log, format: sw-cp-server-error}
  #     # The logs of one domain, listed one by one within the limit of 16 files (the agent finds no file by pattern);
  #     # the format of each depends on the web server that writes it, and a line of another format is shipped as it is:
  #     - {path: /var/www/vhosts/system/<domain>/logs/error_log, format: apache-error}
  #     - {path: /var/www/vhosts/system/<domain>/logs/proxy_error_log, format: nginx-error}
  # The agent can read these error logs only after you grant it read by hand (deploy/agent/README.md, "Error
  # logs of Plesk and the web servers"): they carry client IP addresses and request lines with query strings,
  # all shipped to the backend.
  files: []
  # Rules for lines that are not shipped: a list of at most 64 mappings, each with at least one of `log`
  # (`journal` or a path listed in `files`), `program` (compared whole and literally), `priority` (a line of
  # that priority or less severe; a line without a priority never matches) and `message` (an RE2 regular
  # expression in Go syntax, searched anywhere in the message unless anchored; at most 1024 bytes). A line
  # that meets every condition of any rule is not shipped. All `message` patterns together may compile to at
  # most 400 instructions, and one pattern to at most 400 as well: about a dozen ordinary patterns fit; a
  # pattern with a large repetition such as \pL{0,300} is refused at start-up, and the error names the key.
  # Default: []
  #
  #   drop:
  #     - {program: dovecot, message: '^imap-login: Login: '}
  #     - {log: journal, program: systemd, priority: info, message: '^Started Session '}
  drop: []
