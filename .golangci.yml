version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocognit
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gocognit:
      # SonarQube's go:S3776 threshold; stricter for bare `if err != nil` checks (record 0047).
      min-complexity: 15
    gosec:
      # Only G115, the local stand-in for CodeQL's go/incorrect-integer-conversion (record 0112).
      includes:
        - G115

formatters:
  enable:
    - gofmt
