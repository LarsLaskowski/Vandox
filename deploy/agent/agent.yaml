# Configuration of vandox-agent. Default location: /etc/vandox/agent.yaml
#
# The agent binary reads this file at start-up (-config <file> names another path). The rules below
# describe the loader.
#
# The file is parsed strictly: an unknown key, a duplicate key, a second YAML document, an anchor, a
# custom tag or an invalid value stops the agent at start-up, and the error names the file, the line and
# the key.
#
# Secrets NEVER go into this file. They are read from the environment of the process (or, for a systemd
# unit or a Docker secret, from a file whose absolute path is given in the variable with the _FILE suffix):
#
#   VANDOX_AGENT_TOKEN       the token the backend expects from this agent (required, at least 32
#   VANDOX_AGENT_TOKEN_FILE  characters, printable ASCII without spaces; for example `openssl rand -hex 32`)
#
# Set either the variable or its _FILE form, not both.

# Name of this server, shown in the backend and sent with every batch (required).
# 1 to 64 characters of A-Z a-z 0-9 . _ -, starting with a letter or digit. No default.
agent_id: web-1

backend:
  # Base URL of the vandoxd ingest endpoint (required). Scheme http or https, a host (IP address or
  # name) and an optional port; no user info, path, query or fragment. Plain http is fine inside the
  # tailnet. No default.
  url: http://100.64.0.1:8081

spool:
  # Directory of the local spool where the agent keeps data until the backend has received it. An
  # absolute, clean path (no trailing slash). Default: /var/lib/vandox/spool
  directory: /var/lib/vandox/spool

log:
  # Log level: debug, info, warn or error. Default: info
  level: info

filesystem:
  # Mount points whose size and inode use is recorded every minute: a list of at most 16 absolute,
  # clean paths (no trailing slash, no . or .. elements) of at most 1024 bytes each, every path listed
  # once. A path that is not a mount point of the agent is logged once and left out. An empty list [] turns
  # the file system metrics off. Default: [/]
  mount_points: [/]

processes:
  # Rules that name the program a process belongs to, tried in this order; the first match wins and a
  # process that matches none is named by the first word of its command. At most 64 rules. Each rule has
  # `program` (the name, 1 to 128 characters of A-Z a-z 0-9 . _ : / @ + -, starting with a letter or
  # digit) and exactly one of `command` (the command of the process, compared as a whole) and
  # `cmdline_prefix` (the start of its command line, compared literally; 1 to 256 bytes). With
  # `append_next_word: true` (only with `cmdline_prefix`) the word after the prefix is appended to the
  # program as `<program>/<word>`. The process collector reads the processes every minute; see
  # deploy/agent/README.md for the right it needs to measure the proportional memory (PSS) of every
  # process. Default: [] (no rules). A rule that sums the PHP-FPM pools of a Plesk server, for example:
  #
  #   programs:
  #     - program: php-fpm
  #       cmdline_prefix: "php-fpm: pool "
  #       append_next_word: true
  programs: []

services:
  # Services whose state the collector `systemd` records, as unit names or patterns with `*` and `?`;
  # an entry without a unit type suffix means `<entry>.service`. At most 64 entries of 1 to 255 bytes
  # of A-Z a-z 0-9 : _ . @ * ? -, not starting with . or -; only service units, instances (not
  # templates), each listed once. An empty list [] turns the collector off. Default: sw-cp-server,
  # sw-engine, psa, nginx, apache2, postfix, dovecot, mariadb, plesk-php*-fpm, php*-fpm, fail2ban
  units:
    - sw-cp-server
    - sw-engine
    - psa
    - nginx
    - apache2
    - postfix
    - dovecot
    - mariadb
    - plesk-php*-fpm
    - php*-fpm
    - fail2ban

mariadb:
  # Whether the collector `mariadb` runs: it asks the local MariaDB server over its Unix socket for its
  # status, variables and, when many threads run or the server is under memory pressure, its process
  # list. `false` turns the collector off: no record, no log line, no connection. Default: true
  enabled: true
  # Path of the MariaDB Unix socket. An absolute, clean path (no trailing slash, no . or .. elements) of
  # at most 107 bytes. The agent logs in as the user `vandox-agent`, which deploy/agent/mariadb-user.sql
  # creates (see deploy/agent/README.md). Default: /run/mysqld/mysqld.sock
  socket: /run/mysqld/mysqld.sock

backups:
  # Processes that mean a backup is running, tried in this order: a process counts when its command
  # equals `command` (compared as a whole) or its command line starts with `cmdline_prefix` (compared
  # literally, no pattern). At most 64 rules, each with exactly one of the two, 1 to 256 bytes. The
  # collector `backups` checks the processes every 10 seconds and records when a backup run starts and
  # ends. An empty list [] turns the check off. Default: [{command: pzstd}]
  processes:
    - command: pzstd
