sonar.projectKey=networlddev_vandox
sonar.organization=networlddev

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,tests/**
sonar.exclusions=**/*_test.go,tests/**,bin/**,dist/**,**/obj/**,**/bin/**,TestResults/**

# Go agent: the profile of `go test -coverprofile`. The C# coverage (OpenCover reports of coverlet) is passed
# by the scanner for .NET in ci.yml, because it names generated report folders.
sonar.go.coverage.reportPaths=coverage.out

# Squad and agent tooling is developer tooling, not production code.
sonar.coverage.exclusions=.squad/**,.claude/**
