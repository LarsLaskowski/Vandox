# Compose file of the Vandox backend for Synology Container Manager, QNAP Container Station or plain
# `docker compose up -d` (record 0060). Put this file, vandoxd.yaml and the files below in one directory.
#
# Files you create next to this file:
#   vandoxd.yaml                 copy of deploy/backend/vandoxd.yaml; its web.listen port must match the
#                                container side of the "ports" entry below (8080)
#   secrets/vandox_agent_token   the token the agents present: at least 32 printable ASCII characters, for
#                                example `openssl rand -hex 32`. Compose applies no owner or mode to a file
#                                secret outside Swarm, and the container sees the owner and mode of the host
#                                file. The service runs as 65532 (or the IDs in `user:`), so the file must belong to it and must
#                                never be world-readable:
#                                  sudo chown 65532:65532 secrets/vandox_agent_token
#                                  sudo chmod 0400 secrets/vandox_agent_token
#   secrets/vandox_web_password_hash
#                                the argon2id hash of the web UI password, a single line. Create it without
#                                echoing the password and without a terminal for the container (no -t):
#                                  read -rs -p 'Web UI password: ' pw && echo
#                                  printf '%s\n' "$pw" | docker run --rm -i networlddev/vandox hash-password \
#                                    > secrets/vandox_web_password_hash
#                                Give it the same owner and mode as the token file. The service refuses to
#                                start without a valid hash (docs/areas/web-login.md).
#   import/                      directory for the log import (mounted read-only)
#   .env                         INGEST_BIND_ADDRESS=<this host's tailnet address, `tailscale ip -4`> (required)
#                                WEB_BIND_ADDRESS=<address of this host the reverse proxy reaches> (optional)
#
# The web UI needs a login and runs behind a TLS-terminating reverse proxy (docs/REVERSE_PROXY.md). Set
# web.trusted_proxies in vandoxd.yaml to the proxy's address, so the client address and the HTTPS scheme it
# reports are used.
#
# The web port is published on 127.0.0.1 by default, for a reverse proxy on this host. Set WEB_BIND_ADDRESS
# for a proxy on another host. The binding is defense in depth, not the access control: depending on the
# Docker Engine version and the host firewall, hosts on the LAN may reach a published port directly.
#
# The ingest port (8081) is published on the address in INGEST_BIND_ADDRESS, which has no default: compose
# refuses to start without it (record 0127). Set it to this host's tailnet address (`tailscale ip -4`), or to
# 127.0.0.1 while no agent sends yet. The ingest API needs the agent ID of the one agent the token belongs to:
# set ingest.agent_id in vandoxd.yaml (it has no default; ingest stays disabled until it and the token are set).
# The token, not the binding, is the boundary of the ingest endpoint: depending on the Docker Engine version
# and the host firewall, hosts on the LAN may reach the published ingest port on the tailnet address, too.
#
# Tailscale prerequisite: the backend host runs Tailscale in TUN mode, so the tailnet address is a host
# interface Docker can bind. In userspace-networking mode it is not. On Synology the package is switched to
# TUN mode with `tailscale configure-host` and a restart of the package, repeated at boot by a triggered task.
# Possible symptom in userspace mode (reported, not verified): the container does not start, or is not
# restarted after a reboot, because the bind fails while the address is missing; run `docker compose up -d`
# once Tailscale is up.
#
# A bind-mounted data directory (instead of the named volume) must be owned by the container's user (65532,
# or the IDs set in `user:`), and so must the secret files.
# Prefer an SSD for the data (every committed batch waits for the disk); a hard disk works, too, with slower writes.
name: vandox

services:
  vandoxd:
    # Pin X.Y.Z or a digest for controlled upgrades instead of following latest.
    image: networlddev/vandox:latest
    container_name: vandoxd
    restart: unless-stopped
    # The .NET runtime reads this limit and sizes its heap from it (workstation GC, no server GC).
    mem_limit: 512m
    environment:
      VANDOX_AGENT_TOKEN_FILE: /run/secrets/vandox_agent_token
      VANDOX_WEB_PASSWORD_HASH_FILE: /run/secrets/vandox_web_password_hash
    # The image runs as 65532:65532. To keep the files readable for a user of this host (on a NAS, for
    # example), run as that user's IDs (`id <user>`) and use the bind-mounted data directory below.
    # user: "1026:100"
    # Longer than the 10 s shutdown deadline of vandoxd, so Docker's SIGKILL never cuts it short.
    stop_grace_period: 30s
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${INGEST_BIND_ADDRESS:?set INGEST_BIND_ADDRESS to this host's tailnet address (tailscale ip -4), or 127.0.0.1 without agents}:8081:8081"
    volumes:
      # A new named volume takes over the owner (65532) of /data in the image. With `user:` above, use a
      # data directory owned by that user instead: replace this line with `- ./data:/data`.
      - vandox-data:/data
      - ./import:/import:ro
      - ./vandoxd.yaml:/etc/vandox/vandoxd.yaml:ro
    secrets:
      - vandox_agent_token
      - vandox_web_password_hash
      # Issue #60: the Telegram bot token.
      # - vandox_telegram_bot_token
    read_only: true
    # SQLite's temporary files.
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  vandox-data:

secrets:
  vandox_agent_token:
    file: ./secrets/vandox_agent_token
  vandox_web_password_hash:
    file: ./secrets/vandox_web_password_hash
  # vandox_telegram_bot_token:
  #   file: ./secrets/vandox_telegram_bot_token
