version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocognit
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gocognit:
      # SonarQube's go:S3776 threshold; stricter for bare `if err != nil` checks (record 0047).
      min-complexity: 15
    gosec:
      # Only G115, the local stand-in for CodeQL's go/incorrect-integer-conversion (record 0112).
      includes:
        - G115
  exclusions:
    warn-unused: true
    rules:
      # Sequential error checks that SonarQube rates at most 15 (record 0047).
      - path: ^internal/model/mariadb\.go$
        linters:
          - gocognit
        text: "`\\(\\*MariaDBStatus\\)\\.Validate`"

formatters:
  enable:
    - gofmt
