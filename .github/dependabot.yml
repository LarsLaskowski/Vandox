version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nuget-packages:
        patterns:
          - "*"

  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/deploy/backend"
    schedule:
      interval: weekly
