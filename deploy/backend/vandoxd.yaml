# Configuration of vandoxd. Default location: /etc/vandox/vandoxd.yaml (mount the file into the container).
#
# The file is parsed strictly: an unknown key, a duplicate key, a second YAML document, an anchor, a
# custom tag or an invalid value stops the backend at start-up, and the error names the file, the line and
# the key. Every key is optional; the values below are the defaults, except import.time_zone, which has no
# default and is commented out.
#
# Secrets NEVER go into this file. They are read from the environment of the container (or, for a Docker
# secret, from a file whose absolute path is given in the variable with the _FILE suffix). Set either the
# variable or its _FILE form, not both:
#
#   VANDOX_AGENT_TOKEN           token the agents present (at least 32 printable ASCII characters; unused until the
#                                ingest API of v0.2.0)
#   VANDOX_WEB_PASSWORD_HASH     password hash of the web UI, required: an argon2id hash in the PHC form
#                                $argon2id$v=19$m=...,t=...,p=...$<salt>$<hash>, created with
#                                `vandoxd hash-password` (docs/areas/web-login.md)
#   VANDOX_TELEGRAM_BOT_TOKEN    token of the Telegram bot for the planned alerts (unused in v0.1.0)
#   (each also as VANDOX_..._FILE)

# In the container, the ports below must match the port mappings of docker-compose.yml: the container
# side of "8080:8080" is web.listen. The health check of the image probes web.listen on loopback.

web:
  # Address of the web UI as [host]:port. The host is empty (all interfaces) or an IP address, the port is
  # 1 to 65535 and differs from the ingest port. Default: :8080
  listen: :8080
  # Addresses or networks of the reverse proxies whose X-Forwarded-For and X-Forwarded-Proto headers are
  # trusted, comma-separated: at most 16 entries such as 172.18.0.1 or 172.18.0.0/16 (IPv4 prefix 8 to 32,
  # IPv6 prefix 16 to 128, no host bits set). Empty trusts no proxy: the client is the peer address, and all
  # clients behind a proxy then share the proxy's address and its sign-in lockout. Trusting an address means
  # trusting everyone who connects from it. See docs/REVERSE_PROXY.md. Default: empty
  trusted_proxies: ""

ingest:
  # Address of the ingest endpoint the agents send to, same format as web.listen. Default: :8081
  listen: :8081

storage:
  # Directory where the backend keeps its data. An absolute, clean path (no trailing slash). Default: /data
  directory: /data

log:
  # Log level: debug, info, warn or error. Default: info
  level: info

import:
  # Server paths of the error logs. A file of an import is taken for the log when its parent directory and its
  # name equal those of the path (the rest of the path does not matter, so copies and archives work), also with a
  # rotation suffix (.1, .2, ... or -YYYYMMDD); such a file is read as the log whatever its content, and lines that
  # are not of the format are kept as raw lines. An absolute, clean path of a file in a directory (no trailing
  # slash, no . or .. elements).
  #
  # Plesk panel log. Default: /var/log/plesk/panel.log. The Plesk paths here and below are not verified against
  # a Plesk server; the line format of the panel log is not verified either.
  plesk_panel_log: /var/log/plesk/panel.log
  # Error log of the Plesk panel web server (sw-cp-server). Default: /var/log/sw-cp-server/error_log. Not verified
  # against a Plesk server. The file is recognized by this path only, never by its content.
  sw_cp_server_error_log: /var/log/sw-cp-server/error_log
  # nginx error log. Default: /var/log/nginx/error.log
  nginx_error_log: /var/log/nginx/error.log
  # Apache error log. Default: /var/log/apache2/error.log (Debian and Ubuntu); on RHEL-family servers the log is
  # /var/log/httpd/error_log.
  apache_error_log: /var/log/apache2/error.log
  # IANA time zone of the server the log files come from, for example Europe/Berlin or UTC. Needed to import
  # syslog and kern.log files in the traditional format, whose time stamps carry neither year nor offset, and
  # MariaDB error logs, Dovecot log files and the Plesk panel, nginx and Apache error logs, whose time stamps are
  # local time without an offset, and the legacy top/lsof monitoring log; such a file fails with
  # "import.time_zone is not set" until this is set (a re-run then completes it). No default.
  # time_zone: Europe/Berlin


incidents:
  # How long before an OOM kill an incident starts: a whole number of minutes or hours, written such as 30m or
  # 1h, from 1m to 24h. Used by "vandoxd incidents". Default: 1h
  window_before: 1h
  # How long after an OOM kill an incident ends, same format and range as window_before. Default: 30m
  window_after: 30m
